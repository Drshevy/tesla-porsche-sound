<style>
:root{--bg:#08080a;--panel:#121216;--panel2:#1a1a20;--line:#2a2a32;--txt:#ececef;--dim:#9a9aa5;--red:#d5001c;--red2:#ff2a3d;--gold:#c9a45c;--ok:#2fbf71;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
body{display:flex;flex-direction:column;padding:clamp(8px,1.2vh,18px) clamp(12px,1.4vw,28px);gap:clamp(8px,1vh,14px);
  background:radial-gradient(ellipse at 50% -10%,#1d1d24 0,#08080a 60%)}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px}
h1{margin:0;font-size:clamp(20px,1.8vw,34px);font-weight:800;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
h1 span{color:var(--red2)}
.presets{display:flex;gap:10px;flex:1;min-width:0}
.preset{flex:1;min-height:clamp(56px,6.4vh,80px);background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:6px 14px;text-align:left;cursor:pointer}
.preset b{display:block;font-size:clamp(15px,1.15vw,22px)}
.preset small{display:block;color:var(--dim);font-size:clamp(11px,.8vw,15px);margin-top:2px}
.preset[aria-pressed="true"]{border-color:var(--red);background:linear-gradient(180deg,#2a0a10,#15070a)}
.vol{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:8px 16px;min-height:clamp(56px,6.4vh,80px)}
.vol label{font-size:clamp(14px,1vw,19px)}
.vol input{width:clamp(140px,11vw,230px)}
.vol output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
.cluster{flex:1.25;min-height:0;position:relative;border-radius:28px;border:2px solid #24242b;
  background:linear-gradient(180deg,#141418,#0a0a0c);box-shadow:inset 0 2px 0 #ffffff10,inset 0 -20px 60px #000a,0 10px 40px #0008;overflow:hidden}
.cluster:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff03 0 2px,transparent 2px 5px);pointer-events:none}
#tach{width:100%;height:100%;display:block;position:relative}
.status{position:absolute;top:12px;left:18px;font-size:clamp(12px,.9vw,17px);color:var(--dim);z-index:1}
.status i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#555;margin-right:6px;vertical-align:middle}
.status.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status.crank i{background:var(--gold)}
.controls{display:flex;gap:clamp(10px,1vw,18px);flex:.7;min-height:0;align-items:stretch}
.controls .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:clamp(8px,.8vw,14px);min-width:0}
.startstop{flex:none;align-self:center;width:clamp(170px,22vh,250px);height:clamp(170px,22vh,250px);border-radius:50%;cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#f2f2f4;
  background:radial-gradient(circle at 50% 35%,#2b2b31 0,#111114 55%,#050506 100%);
  border:clamp(8px,1vh,12px) solid #b9b9c2;box-shadow:0 0 0 3px #3a3a42,0 0 0 7px #111,inset 0 6px 14px #ffffff14,inset 0 -10px 24px #000c,0 12px 30px #000a;transition:transform .08s,box-shadow .2s}
.startstop:active{transform:scale(.96)}
.startstop .ss-top,.startstop .ss-bot{font-size:clamp(13px,1.5vh,18px);letter-spacing:.3em;color:#a8a8b2;font-weight:700}
.startstop .ss-main{font-size:clamp(34px,4.6vh,54px);font-weight:900;letter-spacing:.08em}
.startstop[aria-pressed="true"]{box-shadow:0 0 0 3px #d5001c,0 0 0 7px #111,0 0 40px #ff2a3d88,inset 0 6px 14px #ffffff14,inset 0 -10px 24px #000c}
.startstop[aria-pressed="true"] .ss-main{color:#ff2a3d}
.drive{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding-left:clamp(10px,1vw,20px);border-left:2px solid var(--line)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:clamp(13px,.95vw,18px);line-height:1.2}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:72px;height:40px;border-radius:20px;background:#33333c;position:relative;flex:none;transition:background .15s}
.switch .knob:after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#e9e9ee;transition:left .15s}
.switch input:checked+.knob{background:var(--red)}
.switch input:checked+.knob:after{left:36px}
.gps{font-size:clamp(13px,.9vw,17px);color:var(--dim);font-variant-numeric:tabular-nums}
.gps.ok{color:#7ee0a5}
.btn{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:var(--radius);
  font-size:clamp(17px,1.3vw,27px);font-weight:700;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;touch-action:manipulation;transition:transform .06s,border-color .15s}
.btn small{font-size:clamp(11px,.75vw,15px);font-weight:500;color:var(--dim)}
.btn:active{transform:scale(.97);border-color:var(--red)}
.btn.start{border-color:#1f6b45;background:linear-gradient(180deg,#123222,#0b1a12)}
.btn.off{border-color:#6b1f28;background:linear-gradient(180deg,#32121a,#1a0b0e)}
.btn.active{border-color:var(--red2);box-shadow:0 0 0 2px var(--red) inset}
.revbar{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(6px,1vh,14px) clamp(14px,1.4vw,26px);display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:clamp(12px,1.4vw,26px)}
.revbar .lbl{font-size:clamp(16px,1.2vw,24px);font-weight:700;white-space:nowrap}
.revbar .lbl small{display:block;font-weight:400;font-size:clamp(11px,.75vw,14px);color:var(--dim)}
.revval{font-size:clamp(20px,1.8vw,36px);font-weight:800;font-variant-numeric:tabular-nums;min-width:6ch;text-align:center}
.ticks{display:flex;justify-content:space-between;font-size:clamp(11px,.72vw,14px);color:var(--dim);padding:0 30px;margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;touch-action:none}
input[type=range]:focus{outline:none}
#rev{height:clamp(60px,7vh,90px)}
#rev::-webkit-slider-runnable-track{height:28px;border-radius:14px;background:linear-gradient(90deg,#2b2b33 0%,#4a4a55 70%,#8a1020 86%,var(--red2) 100%)}
#rev::-webkit-slider-thumb{-webkit-appearance:none;width:clamp(58px,4.4vw,84px);height:clamp(58px,4.4vw,84px);margin-top:calc((28px - clamp(58px,4.4vw,84px))/2);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#cfcfd6 45%,#7c7c86);border:4px solid var(--red);box-shadow:0 4px 18px #000a}
#rev::-moz-range-track{height:28px;border-radius:14px;background:linear-gradient(90deg,#2b2b33,#4a4a55 70%,#8a1020 86%,var(--red2))}
#rev::-moz-range-thumb{width:70px;height:70px;border-radius:50%;background:#ddd;border:4px solid var(--red)}
.vol input::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:#33333c}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-12px;border-radius:50%;background:#e9e9ee;border:3px solid var(--red)}
.chk{display:flex;align-items:center;gap:10px;font-size:clamp(13px,.9vw,17px);white-space:nowrap;cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--red)}
@media (max-width:1100px){html,body{overflow:auto}.controls .grid{grid-template-columns:1fr 1fr}.revbar{grid-template-columns:1fr}.cluster{min-height:320px}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>Flat-<span>Six</span> Sound</h1>
  <div class="presets" id="presets" role="group" aria-label="Engine character"></div>
  <div class="vol"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="70"><output id="volOut">70%</output></div>
</header>
<section class="cluster">
  <div class="status" id="status"><i></i><span id="statusTxt">Engine off</span></div>
  <canvas id="tach" aria-label="Instrument cluster"></canvas>
</section>
<section class="controls" id="controls">
  <button id="startBtn" class="startstop" aria-pressed="false" aria-label="Engine start / stop"><span class="ss-top">ENGINE</span><span class="ss-main" id="ssMain">START</span><span class="ss-bot" id="ssBot">STOP</span></button>
  <div class="grid">
    <button class="btn" data-cmd="idle">Idle<small>Lift off, back to idle</small></button>
    <button class="btn" data-cmd="blip">Rev blip<small>Quick stab of throttle</small></button>
    <button class="btn" data-cmd="redline">Rev to redline<small>Full throttle into the limiter</small></button>
    <button class="btn" data-cmd="launch">Launch &amp; upshifts<small>Accelerate through the gears</small></button>
    <button class="btn" data-cmd="downshift">Downshift<small>With throttle blip (rev-match)</small></button>
    <button class="btn" data-cmd="pops">Overrun pops<small>Crackles on lift-off</small></button>
  </div>
</section>
<section class="revbar">
  <div class="lbl">Rev pedal<small>Drag to set rpm</small></div>
  <div><input type="range" id="rev" min="900" max="9000" step="10" value="900" aria-label="Target rpm"><div class="ticks" id="ticks"></div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div class="revval" id="revVal">900</div>
    <label class="chk"><input type="checkbox" id="springBack" checked>Return to idle on release</label></div>
  <div class="drive">
    <label class="switch"><input type="checkbox" id="driveMode" checked><span class="knob"></span><span class="sw-lbl">Drive mode:<br><b>Follow speed (GPS)</b></span></label>
    <div class="gps" id="gpsStatus">GPS off</div>
  </div>
</section>
<script>
'use strict';
/* =====================================================================
   Flat-six engine synthesizer – Web Audio API only, no samples, no deps.
   ===================================================================== */
(function () {
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- Character presets ("inspired by" – not affiliated) ---------- */
const PRESETS = {
  gt3: {
    id: 'gt3', name: 'Inspired by 911 GT3 4.0', sub: 'Naturally aspirated flat-six · 9,000 rpm', lope: 0.12, room: 0.16, flap: 5600, whine: 0.004,
    idle: 900, redline: 9000, limiter: 9100, shiftRpm: 8850, launchRpm: 5200, maxAccel: 16000, torque: 'na',
    harm: { firing: 1.0, bank: 0.32, crank: 0.16, odd: 0.09, tilt: 0.55, roll: 54 },
    jitter: 8, rough: 0.05, drive: 3.0, exhaustLP: 5600,
    res: [[170, 2.2, 0.9], [540, 3, 0.65], [1350, 4, 0.55], [2700, 5, 0.35]],
    intakeNoise: 0.16, intakeTone: 0.24, mech: 0.035, level: 1.0,
    crackle: 0.8, crackleLevel: 0.55, crackleTime: 1.4,
    ratios: [0, 3.75, 2.38, 1.72, 1.34, 1.11, 0.96], pdk: [3.75, 2.38, 1.72, 1.34, 1.11, 0.96, 0.84], final: 4.0, upMax: 6500, topGear: 4, gearK: 13
  },
  turbo: {
    id: 'turbo', name: 'Inspired by 911 Turbo S', sub: 'Twin-turbo · whistle & blow-off', lope: 0.08, room: 0.2, flap: 0, whine: 0.003,
    idle: 850, redline: 7200, limiter: 7300, shiftRpm: 7050, launchRpm: 4500, maxAccel: 14500, torque: 'turbo',
    harm: { firing: 1.0, bank: 0.2, crank: 0.1, odd: 0.05, tilt: 0.95, roll: 36 },
    jitter: 6, rough: 0.035, drive: 2.0, exhaustLP: 2500,
    res: [[125, 2, 1.0], [360, 2.5, 0.6], [880, 3, 0.3]],
    intakeNoise: 0.1, intakeTone: 0.07, mech: 0.02, level: 1.15,
    crackle: 0.35, crackleLevel: 0.4, crackleTime: 0.9,
    turbo: true, whistle: 0.035, bov: 0.55,
    ratios: [0, 3.91, 2.29, 1.65, 1.30, 1.08, 0.88], pdk: [3.91, 2.29, 1.65, 1.30, 1.08, 0.88, 0.62], final: 3.55, upMax: 6200, topGear: 4, gearK: 14
  },
  classic: {
    id: 'classic', name: 'Inspired by classic air-cooled 911', sub: 'Air-cooled flat-six · fan whine & rasp', lope: 0.22, room: 0.14, flap: 0, whine: 0.006,
    idle: 900, redline: 6800, limiter: 6900, shiftRpm: 6600, launchRpm: 4500, maxAccel: 9500, torque: 'na',
    harm: { firing: 1.0, bank: 0.5, crank: 0.3, odd: 0.2, tilt: 0.45, roll: 46 },
    jitter: 15, rough: 0.1, drive: 4.0, exhaustLP: 4300,
    res: [[150, 2, 1.0], [450, 3, 0.8], [1100, 3.5, 0.6], [2200, 4, 0.3]],
    intakeNoise: 0.24, intakeTone: 0.16, mech: 0.05, level: 1.0,
    crackle: 1.0, crackleLevel: 0.6, crackleTime: 1.9,
    fan: 0.035,
    ratios: [0, 3.18, 1.83, 1.26, 0.96, 0.75], pdk: [3.82, 2.20, 1.52, 1.22, 1.02, 0.84, 0.71], final: 3.44, upMax: 6000, topGear: 3, gearK: 10
  }
};

/* ---------- Physics-ish engine/driveline simulation ---------- */
class Sim {
  constructor(p) { this.p = p; this.reset(); }
  reset() {
    Object.assign(this, { rpm: 0, running: false, cranking: false, thr: 0, load: 0, gear: 0, boost: 0, fuelCut: false,
      coldExtra: 0, overrun: 0, crackleBoost: 1, shift: null, brake: 0, prog: null, sliderTarget: null,
      events: [], prevIntent: 0, t: 0, speed: 0, oil: 38,
      driveMode: false, driveSpeed: null, vs: 0, vPrev: 0, acc: 0, dGear: 1, lastShift: -9, drive: false, driveTarget: 0 });
  }
  setPreset(p) { this.p = p; if (this.rpm > p.limiter) this.rpm = p.limiter - 200; if (this.gear >= p.ratios.length) this.gear = p.ratios.length - 1; }
  torque(r) {
    const p = this.p, x = r / p.redline;
    if (p.torque === 'turbo') return (0.5 + 0.5 * smooth(0.22, 0.5, x) - 0.12 * smooth(0.85, 1.02, x)) * (0.55 + 0.45 * this.boost);
    return 0.62 + 0.38 * Math.sin(Math.PI * clamp(x, 0, 1.2) * 0.72);
  }
  drag(r) { return r < 1 ? 0 : 380 + 0.42 * r; }
  holdThr(target) { const ff = this.drag(target) / (Math.max(0.2, this.torque(target)) * this.p.maxAccel); return clamp(ff + (target - this.rpm) * 0.0012, 0, 1); }
  loadFactor() { return this.gear ? 1 + this.p.gearK / Math.pow(this.p.ratios[this.gear], 2) : 1; }
  doShift(dir) {
    const to = this.gear + dir, R = this.p.ratios;
    if (this.shift || to < 1 || to >= R.length || !this.gear) return false;
    const target = Math.min(this.rpm * R[to] / R[this.gear], this.p.limiter - 150);
    this.shift = { to, dir, t: 0, dur: dir > 0 ? 0.09 : 0.2, target };
    if (dir > 0) { this.events.push({ type: 'shiftCrack' }); if (this.p.turbo && this.boost > 0.4) this.events.push({ type: 'bov', amt: this.boost * 0.45 }); }
    return true;
  }
  /* ---- Follow-speed mode: road speed (km/h) -> simulated 7-speed PDK -> rpm + load ---- */
  rpmAtGear(g, v) { const p = this.p; return v / 3.6 / 2.07 * 60 * p.pdk[g - 1] * p.final; }
  driveActive() { return this.driveMode && this.driveSpeed != null && this.running && !this.cranking && !this.prog && this.sliderTarget == null; }
  driveCalc(dt) {
    const p = this.p;
    this.vs += (this.driveSpeed - this.vs) * (1 - Math.exp(-dt / 0.5));
    const v = this.vs, a = (v - this.vPrev) / Math.max(dt, 1e-4); this.vPrev = v;
    this.acc += (a - this.acc) * (1 - Math.exp(-dt / 0.7));           // km/h per second, smoothed
    const acc = this.acc;
    let load = acc > 0.4 ? clamp(0.2 + acc / 8, 0, 1) : acc < -1 ? 0 : clamp(0.1 + v / 700, 0, 0.35);   // cruise: small load rising with aero drag
    if (!this.gear || this.gear > 7) this.gear = this.dGear;
    let target;
    if (v < 4) {
      this.dGear = 1; if (!this.shift) this.gear = 1;
      target = p.idle + (acc > 0.5 ? 1100 * load : 0);                  // stopped / pulling away: clutch slip
      if (acc <= 0.4) load = 0;
    } else {
      const up = 2300 + (p.upMax - 2300) * smooth(0.15, 0.85, load);
      const down = acc < -2 ? 2100 : 1250 + 1300 * load;
      if (!this.shift && this.t - this.lastShift > 0.7) {
        const r = this.rpmAtGear(this.dGear, v);
        let to = 0;
        if (r > up && this.dGear < 7 && acc > -0.5) to = this.dGear + 1;          // never upshift while slowing
        else if (this.dGear > 1 && r < down && (load > 0.5 || this.rpmAtGear(this.dGear - 1, v) < 4300)) to = this.dGear - 1;
        else if (load > 0.85 && this.dGear > 1 && this.rpmAtGear(this.dGear - 1, v) < up - 1500) to = this.dGear - 1;   // kickdown
        if (to) {
          const dir = to > this.dGear ? 1 : -1;
          this.shift = { to, dir, t: 0, dur: dir > 0 ? 0.08 + (1 - load) * 0.1 : 0.18, target: this.rpmAtGear(to, v), drive: true };
          if (dir > 0 && load > 0.55) { this.events.push({ type: 'shiftCrack' }); if (p.turbo && this.boost > 0.5) this.events.push({ type: 'bov', amt: this.boost * 0.4 }); }
          this.dGear = to; this.lastShift = this.t;
        }
      }
      target = Math.max(p.idle, this.rpmAtGear(this.dGear, v));
      if (this.dGear === 1 && v < 15 && acc > 0.5) target = Math.max(target, p.idle + 1500 * load);
    }
    this.driveTarget = Math.min(target, p.limiter - 50);
    this.driveLoad = load;
    return load;
  }
  startPhases() {
    return [
      { enter: s => { s.cranking = true; s.running = false; }, thr: 0, dur: 0.85 },
      { enter: s => { s.cranking = false; s.running = true; s.coldExtra = 450; s.rpm = Math.max(s.rpm, 650); }, thr: 0.5, dur: 0.22 },
      { thr: 0, dur: 0.9 }
    ];
  }
  command(name) {
    const p = this.p, needStart = !this.running && !this.cranking;
    const st = needStart ? this.startPhases() : [];
    const hold = r => s => s.holdThr(r);
    const reach = r => [{ thr: 1, until: s => s.rpm >= r - 250, maxDur: 2.5 }, { thr: hold(r), dur: 0.35 }];
    let ph = null;
    switch (name) {
