<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#060607;--panel:#111114;--panel2:#18181d;--line:#25252c;--txt:#f1f1f4;--dim:#8d8d98;--red:#e0001f;--red2:#ff2d42;--gold:#d8b36a;--ok:#35d07f;--radius:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
body{display:flex;flex-direction:column;padding:clamp(10px,1.4vh,20px) clamp(14px,1.5vw,30px);gap:clamp(10px,1.3vh,18px);
  background:radial-gradient(ellipse 80% 60% at 50% 38%,#17171d 0,#060607 70%)}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:clamp(10px,1vw,18px);flex:none}
.brand{display:flex;align-items:baseline;gap:14px;white-space:nowrap}
h1{margin:0;font-size:clamp(22px,1.9vw,36px);font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h1 span{color:var(--red2)}
.brand small{font-size:clamp(12px,.85vw,16px);color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:10px;min-height:clamp(60px,6.6vh,80px);padding:0 18px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line)}
.gps{font-size:clamp(14px,.95vw,18px);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.gps:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#55555f;margin-right:10px;vertical-align:1px}
.gps.ok{color:#9ff0c2}.gps.ok:before{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:clamp(14px,.95vw,18px);font-weight:700;white-space:nowrap}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:76px;height:42px;border-radius:21px;background:#2c2c34;position:relative;flex:none;transition:background .2s}
.switch .knob:after{content:"";position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#f1f1f4;transition:left .22s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px #0008}
.switch input:checked+.knob{background:var(--red)}
.switch input:checked+.knob:after{left:38px}
.setbtn{min-height:clamp(60px,6.6vh,80px);padding:0 26px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-size:clamp(15px,1.05vw,20px);font-weight:800;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:10px;transition:border-color .15s,transform .08s}
.setbtn svg{width:24px;height:24px}
.setbtn:active{transform:scale(.97);border-color:var(--red)}
.cluster{flex:1;min-height:0;position:relative;border-radius:32px;border:1.5px solid #1f1f26;
  background:radial-gradient(ellipse 60% 85% at 50% 55%,#131318 0,#0a0a0c 65%,#070708 100%);box-shadow:inset 0 1px 0 #ffffff12,inset 0 -30px 80px #000c,0 18px 50px #000a;overflow:hidden}
#tach{width:100%;height:100%;display:block;position:relative}
.status{position:absolute;top:16px;left:22px;font-size:clamp(13px,.9vw,17px);color:var(--dim);z-index:1;letter-spacing:.04em}
.status i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#55555f;margin-right:8px;vertical-align:middle;transition:background .2s}
.status.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status.crank i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.dock{display:flex;gap:clamp(12px,1.1vw,20px);align-items:center;flex:none;height:clamp(150px,17vh,210px)}
.startstop{flex:none;width:clamp(150px,17vh,205px);height:clamp(150px,17vh,205px);border-radius:50%;cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#f2f2f4;position:relative;
  background:radial-gradient(circle at 50% 32%,#2e2e35 0,#121215 55%,#060607 100%);
  border:clamp(7px,.9vh,10px) solid #c3c3cc;box-shadow:0 0 0 3px #34343c,0 0 0 8px #0d0d10,inset 0 6px 14px #ffffff18,inset 0 -10px 24px #000c,0 14px 34px #000b;transition:transform .1s,box-shadow .3s}
.startstop:active{transform:scale(.95)}
.startstop .ss-top,.startstop .ss-bot{font-size:clamp(12px,1.35vh,16px);letter-spacing:.32em;color:#a2a2ad;font-weight:800}
.startstop .ss-main{font-size:clamp(30px,4vh,48px);font-weight:900;letter-spacing:.08em;transition:color .2s}
.startstop[aria-pressed="false"]{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 3px #5a1018,0 0 0 8px #0d0d10,0 0 26px #ff2a3d44,inset 0 6px 14px #ffffff18,inset 0 -10px 24px #000c,0 14px 34px #000b}}
.startstop[aria-pressed="true"]{box-shadow:0 0 0 3px var(--red),0 0 0 8px #0d0d10,0 0 46px #ff2a3d99,inset 0 6px 14px #ffffff18,inset 0 -10px 24px #000c}
.startstop[aria-pressed="true"] .ss-main{color:var(--red2);text-shadow:0 0 18px #ff2a3d88}
.cars{flex:1;min-width:0;display:flex;align-items:stretch;gap:10px;height:100%}
.arrow{flex:none;width:clamp(54px,3.6vw,70px);border-radius:var(--radius);border:1.5px solid var(--line);background:var(--panel);font-size:42px;line-height:1;cursor:pointer;color:#cfcfd6;transition:transform .08s}
.arrow:active{transform:scale(.94)}
.strip{flex:1;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:2px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%)}
.strip::-webkit-scrollbar{display:none}
.car{flex:0 0 clamp(230px,14.6vw,290px);scroll-snap-align:start;text-align:left;padding:14px 16px;border-radius:var(--radius);border:1.5px solid var(--line);cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#1b1b21 0%,#111114 55%,#0b0b0d 100%);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:border-color .2s,transform .1s,box-shadow .3s,background .3s}
.car:active{transform:scale(.97)}
.car:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background .2s}
.car .ib{font-size:clamp(10px,.66vw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.car .nm{font-size:clamp(17px,1.15vw,23px);font-weight:850;line-height:1.12}
.car .sp{font-size:clamp(12px,.8vw,15px);color:#c4c4cc}
.car .ft{display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,.74vw,14px);color:var(--dim)}
.car .tg{font-weight:900;color:#fff;background:#2a2a32;border-radius:8px;padding:3px 9px;letter-spacing:.06em}
.car[aria-selected="true"]{border-color:#ff2d4288;background:linear-gradient(150deg,#3b0b14 0%,#1b080c 60%,#0f0608 100%);box-shadow:0 0 30px #e0001f33,inset 0 1px 0 #ffffff14}
.car[aria-selected="true"]:before{background:var(--red2);box-shadow:0 0 12px var(--red2)}
.car[aria-selected="true"] .tg{background:var(--red)}
.volbox{flex:none;width:clamp(220px,14vw,280px);height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 20px;border-radius:var(--radius);background:var(--panel);border:1.5px solid var(--line)}
.volbox .vl{display:flex;justify-content:space-between;font-size:clamp(13px,.9vw,17px);color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.volbox output{color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;touch-action:none;height:48px}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--red) var(--fill,50%),#2e2e36 var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:42px;height:42px;margin-top:-16px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#cfcfd6);border:0;box-shadow:0 3px 10px #000a,0 0 0 4px #ffffff10}
.sheet{position:fixed;inset:0;background:#000b;z-index:20;display:flex;justify-content:flex-end;animation:fade .2s ease}
.sheet .panel{width:min(780px,96vw);height:100%;overflow:auto;background:linear-gradient(180deg,#121216,#0b0b0e);border-left:1.5px solid var(--line);padding:clamp(18px,2.2vh,30px) clamp(20px,1.8vw,36px);box-shadow:-24px 0 70px #000d;animation:slide .26s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph h2{margin:0;font-size:clamp(24px,1.8vw,34px);letter-spacing:.02em}
.close{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-size:26px;cursor:pointer}
.sheet h3{margin:24px 0 10px;font-size:clamp(14px,.95vw,18px);color:var(--dim);text-transform:uppercase;letter-spacing:.18em}
.eqp{display:flex;gap:10px;flex-wrap:wrap}
.eqp button,.ghost{min-height:60px;padding:0 22px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel2);font-size:clamp(14px,1vw,19px);font-weight:800;cursor:pointer;transition:border-color .15s,background .15s}
.eqp button[aria-pressed="true"]{border-color:var(--red2);background:#2c0a11;box-shadow:0 0 16px #e0001f33}
.bands,.levels{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.rowc{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:16px;min-height:60px}
.rowc label{font-size:clamp(14px,1vw,19px);font-weight:750}
.rowc output{text-align:right;font-variant-numeric:tabular-nums;color:#ddd;font-size:clamp(14px,1vw,18px)}
.row-end{display:flex;justify-content:flex-end;margin-top:20px}
.hidden{display:none!important}
@media (max-width:1100px){html,body{overflow:auto}header{flex-wrap:wrap}.cluster{min-height:340px;flex:none;height:56vh}.dock{flex-wrap:wrap;height:auto}.cars{height:140px;flex-basis:100%;order:3}.volbox{height:120px}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Supercar <span>Sound</span></h1><small>Engine synthesizer</small></div>
  <div class="spacer"></div>
  <div class="chip"><div class="gps" id="gpsStatus">GPS off - idle</div></div>
  <div class="chip"><label class="switch"><input type="checkbox" id="driveMode" checked><span class="knob"></span><span class="sw-lbl">Follow speed (GPS)</span></label></div>
  <button class="setbtn" id="fsBtn" aria-label="Full screen">⛶</button>
  <button class="setbtn" id="openEq" aria-label="Sound settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Sound settings</button>
</header>
<section class="cluster">
  <div class="status" id="status"><i></i><span id="statusTxt">Engine off</span></div>
  <canvas id="tach" aria-label="Instrument cluster"></canvas>
</section>
<section class="dock" id="controls">
  <button id="startBtn" class="startstop" aria-pressed="false" aria-label="Engine start / stop"><span class="ss-top">ENGINE</span><span class="ss-main" id="ssMain">START</span><span class="ss-bot" id="ssBot">STOP</span></button>
  <div class="cars">
    <button class="arrow" id="carPrev" aria-label="Previous cars">‹</button>
    <div class="strip" id="presets" role="listbox" aria-label="Car"></div>
    <button class="arrow" id="carNext" aria-label="More cars">›</button>
  </div>
  <div class="volbox"><div class="vl"><label for="vol">Volume</label><output id="volOut">70%</output></div><input type="range" id="vol" min="0" max="100" value="70"></div>
</section>
<div class="sheet hidden" id="eqSheet" role="dialog" aria-label="Sound settings">
  <div class="panel">
    <div class="ph"><h2>Sound settings</h2><button class="close" id="closeEq" aria-label="Close">✕</button></div>
    <h3>Equalizer</h3>
    <div class="eqp" id="eqPresets"></div>
    <div class="bands" id="eqBands"></div>
    <h3>Levels</h3>
    <div class="levels" id="levels"></div>
    <div class="row-end"><button class="ghost" id="resetEq">Reset all</button></div>
  </div>
</div>
