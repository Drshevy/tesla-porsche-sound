<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08080a">
<title>Supercar Sound – engine synthesizer for the Tesla browser</title>
<!--PWA-START-->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!--PWA-END-->
<style>
:root{--bg:#08080a;--panel:#121216;--panel2:#1a1a20;--line:#2a2a32;--txt:#ececef;--dim:#9a9aa5;--red:#d5001c;--red2:#ff2a3d;--gold:#c9a45c;--ok:#2fbf71;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
body{display:flex;flex-direction:column;padding:clamp(8px,1.2vh,18px) clamp(12px,1.4vw,28px);gap:clamp(8px,1vh,14px);
  background:radial-gradient(ellipse at 50% -10%,#1d1d24 0,#08080a 60%)}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px}
h1{margin:0;font-size:clamp(20px,1.8vw,34px);font-weight:800;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
h1 span{color:var(--red2)}
.spacer{flex:1}
.setbtn{min-height:clamp(56px,6.4vh,80px);padding:0 22px;border-radius:var(--radius);border:2px solid var(--line);background:var(--panel);font-size:clamp(15px,1.05vw,20px);font-weight:700;cursor:pointer;white-space:nowrap}
.setbtn:active{border-color:var(--red)}
.cars{display:flex;align-items:stretch;gap:10px;flex:none}
.arrow{flex:none;width:clamp(48px,3.4vw,64px);border-radius:var(--radius);border:2px solid var(--line);background:var(--panel);font-size:40px;line-height:1;cursor:pointer}
.strip{flex:1;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:2px}
.strip::-webkit-scrollbar{display:none}
.car{flex:0 0 clamp(230px,15.2vw,300px);scroll-snap-align:start;min-height:clamp(96px,10.5vh,128px);text-align:left;padding:10px 14px 10px 16px;border-radius:18px;border:2px solid var(--line);cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1c1c22 0%,#121216 60%,#0d0d10 100%);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:border-color .15s,transform .08s}
.car:active{transform:scale(.98)}
.car:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#ffffff0d,transparent 70%)}
.car .ib{font-size:clamp(10px,.68vw,13px);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.car .nm{font-size:clamp(16px,1.12vw,22px);font-weight:800;line-height:1.15}
.car .sp{font-size:clamp(11px,.78vw,15px);color:#c9c9d1}
.car .ft{display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,.75vw,14px);color:var(--dim)}
.car .tg{font-weight:800;color:#fff;background:#2b2b33;border-radius:8px;padding:2px 8px;letter-spacing:.05em}
.car[aria-selected="true"]{border-color:var(--red);background:linear-gradient(135deg,#3a0b14 0%,#1a080c 65%,#100609 100%);box-shadow:0 0 24px #d5001c33}
.car[aria-selected="true"] .tg{background:var(--red)}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:flex-end}
.sheet .panel{width:min(760px,96vw);height:100%;overflow:auto;background:#101014;border-left:2px solid var(--line);padding:clamp(16px,2vh,28px) clamp(18px,1.6vw,32px);box-shadow:-20px 0 60px #000c}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph h2{margin:0;font-size:clamp(22px,1.7vw,32px)}
.close{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:26px;cursor:pointer}
.sheet h3{margin:22px 0 10px;font-size:clamp(15px,1.05vw,20px);color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
.eqp{display:flex;gap:10px;flex-wrap:wrap}
.eqp button,.ghost{min-height:56px;padding:0 20px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-size:clamp(14px,1vw,19px);font-weight:700;cursor:pointer}
.eqp button[aria-pressed="true"]{border-color:var(--red);background:#2a0a10}
.bands,.levels{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.rowc{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:14px;min-height:58px}
.rowc label{font-size:clamp(14px,1vw,19px);font-weight:700}
.rowc output{text-align:right;font-variant-numeric:tabular-nums;color:#ddd;font-size:clamp(14px,1vw,18px)}
.rowc input{height:48px}
.rowc input::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#33333c,#4a4a55)}
.rowc input::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;margin-top:-15px;border-radius:50%;background:#e9e9ee;border:3px solid var(--red)}
.row-end{display:flex;justify-content:flex-end;margin-top:18px}
.hidden{display:none!important}
.vol{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:8px 16px;min-height:clamp(56px,6.4vh,80px)}
.vol label{font-size:clamp(14px,1vw,19px)}
.vol input{width:clamp(140px,11vw,230px)}
.vol output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
.cluster{flex:1.25;min-height:0;position:relative;border-radius:28px;border:2px solid #24242b;
  background:linear-gradient(180deg,#141418,#0a0a0c);box-shadow:inset 0 2px 0 #ffffff10,inset 0 -20px 60px #000a,0 10px 40px #0008;overflow:hidden}
.cluster:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff03 0 2px,transparent 2px 5px);pointer-events:none}
#tach{width:100%;height:100%;display:block;position:relative}
.status{position:absolute;top:12px;left:18px;font-size:clamp(12px,.9vw,17px);color:var(--dim);z-index:1}
.status i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#555;margin-right:6px;vertical-align:middle}
.status.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.status.crank i{background:var(--gold)}
.controls{display:flex;gap:clamp(10px,1vw,18px);flex:.85;min-height:0;align-items:stretch}
.controls .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:clamp(8px,.8vw,14px);min-width:0}
.startstop{flex:none;align-self:center;width:clamp(170px,22vh,250px);height:clamp(170px,22vh,250px);border-radius:50%;cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#f2f2f4;
  background:radial-gradient(circle at 50% 35%,#2b2b31 0,#111114 55%,#050506 100%);
  border:clamp(8px,1vh,12px) solid #b9b9c2;box-shadow:0 0 0 3px #3a3a42,0 0 0 7px #111,inset 0 6px 14px #ffffff14,inset 0 -10px 24px #000c,0 12px 30px #000a;transition:transform .08s,box-shadow .2s}
.startstop:active{transform:scale(.96)}
.startstop .ss-top,.startstop .ss-bot{font-size:clamp(13px,1.5vh,18px);letter-spacing:.3em;color:#a8a8b2;font-weight:700}
.startstop .ss-main{font-size:clamp(34px,4.6vh,54px);font-weight:900;letter-spacing:.08em}
.startstop[aria-pressed="true"]{box-shadow:0 0 0 3px #d5001c,0 0 0 7px #111,0 0 40px #ff2a3d88,inset 0 6px 14px #ffffff14,inset 0 -10px 24px #000c}
.startstop[aria-pressed="true"] .ss-main{color:#ff2a3d}
.drive{display:flex;flex-direction:column;gap:4px;justify-content:center;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:6px 16px;min-height:clamp(56px,6.4vh,80px)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:clamp(13px,.95vw,18px);line-height:1.2}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:72px;height:40px;border-radius:20px;background:#33333c;position:relative;flex:none;transition:background .15s}
.switch .knob:after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#e9e9ee;transition:left .15s}
.switch input:checked+.knob{background:var(--red)}
.switch input:checked+.knob:after{left:36px}
.gps{font-size:clamp(13px,.9vw,17px);color:var(--dim);font-variant-numeric:tabular-nums}
.gps.ok{color:#7ee0a5}
.btn{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:var(--radius);
  font-size:clamp(17px,1.3vw,27px);font-weight:700;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;touch-action:manipulation;transition:transform .06s,border-color .15s}
.btn small{font-size:clamp(11px,.75vw,15px);font-weight:500;color:var(--dim)}
.btn:active{transform:scale(.97);border-color:var(--red)}
.btn.start{border-color:#1f6b45;background:linear-gradient(180deg,#123222,#0b1a12)}
.btn.off{border-color:#6b1f28;background:linear-gradient(180deg,#32121a,#1a0b0e)}
.btn.active{border-color:var(--red2);box-shadow:0 0 0 2px var(--red) inset}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:0;touch-action:none}
input[type=range]:focus{outline:none}
.vol input::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:#33333c}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-12px;border-radius:50%;background:#e9e9ee;border:3px solid var(--red)}
@media (max-width:1100px){html,body{overflow:auto}.setbtn{min-height:56px}.controls .grid{grid-template-columns:1fr 1fr}.cluster{min-height:320px}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>Supercar <span>Sound</span></h1>
  <div class="spacer"></div>
  <div class="vol"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="70"><output id="volOut">70%</output></div>
  <div class="drive">
    <label class="switch"><input type="checkbox" id="driveMode" checked><span class="knob"></span><span class="sw-lbl">Drive mode:<br><b>Follow speed (GPS)</b></span></label>
    <div class="gps" id="gpsStatus">GPS off - idle</div>
  </div>
  <button class="setbtn" id="openEq" aria-label="Sound settings">🎚 Sound settings</button>
</header>
<section class="cars">
  <button class="arrow" id="carPrev" aria-label="Previous cars">‹</button>
  <div class="strip" id="presets" role="listbox" aria-label="Car"></div>
  <button class="arrow" id="carNext" aria-label="More cars">›</button>
</section>
<section class="cluster">
  <div class="status" id="status"><i></i><span id="statusTxt">Engine off</span></div>
  <canvas id="tach" aria-label="Instrument cluster"></canvas>
</section>
<section class="controls" id="controls">
  <button id="startBtn" class="startstop" aria-pressed="false" aria-label="Engine start / stop"><span class="ss-top">ENGINE</span><span class="ss-main" id="ssMain">START</span><span class="ss-bot" id="ssBot">STOP</span></button>
  <div class="grid">
    <button class="btn" data-cmd="idle">Idle<small>Lift off, back to idle</small></button>
    <button class="btn" data-cmd="blip">Rev blip<small>Quick stab of throttle</small></button>
    <button class="btn" data-cmd="redline">Rev to redline<small>Full throttle into the limiter</small></button>
    <button class="btn" data-cmd="launch">Launch &amp; upshifts<small>Accelerate through the gears</small></button>
    <button class="btn" data-cmd="downshift">Downshift<small>With throttle blip (rev-match)</small></button>
    <button class="btn" data-cmd="pops">Overrun pops<small>Crackles on lift-off</small></button>
  </div>
</section>
<div class="sheet hidden" id="eqSheet" role="dialog" aria-label="Sound settings">
  <div class="panel">
    <div class="ph"><h2>Sound settings</h2><button class="close" id="closeEq" aria-label="Close">✕</button></div>
    <h3>Equalizer</h3>
    <div class="eqp" id="eqPresets"></div>
    <div class="bands" id="eqBands"></div>
    <h3>Levels</h3>
    <div class="levels" id="levels"></div>
    <div class="row-end"><button class="ghost" id="resetEq">Reset all</button></div>
  </div>
</div>

buildSettings();
$('vol').value = Math.round(app.vol * 100); $('volOut').textContent = $('vol').value + '%';

  $('vol').value = Math.round(app.vol * 100); $('volOut').textContent = $('vol').value + '%'; applyEq(); applyLevels(); saveSettings(); buildSettings(); });

async function unlock() {
  if (app.ctx) return;

  if (!AC) { $('statusTxt').textContent = 'This browser does not support Web Audio'; return; }
  app.ctx = new AC({ latencyHint: 'interactive' });
  try { await app.ctx.resume(); } catch (e) {}
  app.eqc = buildEq(app.ctx, app.ctx.destination);
  app.eng = new Engine(app.ctx, PRESETS[app.preset], app.eqc.input);
  applyLevels(); app.eng.start();
  app.last = performance.now();
  app.timer = setInterval(tick, 15);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && app.ctx.state !== 'running') app.ctx.resume(); });
}

/* ---------- GPS speed source (Follow-speed drive mode) ---------- */

// ?sim=1 – debug drive: fake 1 Hz fixes for 0 → 120 → 0 km/h (speed omitted on every other fix to exercise the fallback)
function simProfile(t) {

$('driveMode').addEventListener('change', e => { settings.drive = e.target.checked; saveSettings(); });
$('driveMode').addEventListener('change', e => { if (e.target.checked && (app.sim.running || app.sim.cranking)) startGps(); else if (!e.target.checked) stopGps(); });

/* ---------- Engine START / STOP ---------- */
$('startBtn').addEventListener('click', () => {
  unlock();
  if (app.ctx && app.ctx.state !== 'running') app.ctx.resume();
  const sim = app.sim;
  if (sim.running || sim.cranking) { sim.command('off'); stopGps(); }
  else { sim.sliderTarget = null; sim.command('start'); if ($('driveMode').checked) { startGps(); startImu(); } }
});

function tick() {
  const now = performance.now(); let dt = Math.min(0.1, (now - app.last) / 1000); app.last = now;
  const sim = app.sim, h = 1 / 240;
  sim.driveMode = $('driveMode').checked;
  if (sim.driveMode && (sim.running || sim.cranking) && gps.status === 'off') startGps();
  const gs = sim.driveMode ? gpsState() : null;
  sim.driveSpeed = gs ? gs.v : null; sim.driveAcc = gs ? gs.a : null;
  while (dt > 1e-6) { const s = Math.min(h, dt); sim.step(s); dt -= s; }
  if (app.eng) app.eng.apply(sim, app.ctx.currentTime + 0.025, 0.015);
}

document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => {
  if (!app.ctx) unlock();
  if (app.ctx && app.ctx.state !== 'running') app.ctx.resume();
  app.sim.command(b.dataset.cmd);
}));

$('vol').addEventListener('input', e => { app.vol = e.target.value / 100; settings.levels.master = app.vol; $('volOut').textContent = e.target.value + '%'; applyLevels(); saveSettings(); });


/* ---------- Premium instrument cluster ---------- */
const cv = $('tach'), g2 = cv.getContext('2d');
let shownRpm = 0, shownSpd = 0, shownAux = 0;
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
function bezel(g, cx, cy, R) {
  const gr = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  gr.addColorStop(0, '#9a9aa3'); gr.addColorStop(0.25, '#2a2a30'); gr.addColorStop(0.5, '#c8c8d0'); gr.addColorStop(0.75, '#2a2a30'); gr.addColorStop(1, '#8a8a93');
  g.beginPath(); g.arc(cx, cy, R * 1.1, 0, Math.PI * 2); g.fillStyle = gr; g.fill();
  g.beginPath(); g.arc(cx, cy, R * 1.06, 0, Math.PI * 2); g.fillStyle = '#050506'; g.fill();
  const face = g.createRadialGradient(cx, cy - R * 0.3, R * 0.1, cx, cy, R * 1.05);
  face.addColorStop(0, '#1c1c22'); face.addColorStop(1, '#060607');

}
function needle(g, cx, cy, R, a, len) {
  g.save(); g.shadowColor = '#ff2a3d'; g.shadowBlur = R * 0.08;
  g.beginPath(); g.moveTo(cx - Math.cos(a) * R * 0.14, cy - Math.sin(a) * R * 0.14); g.lineTo(cx + Math.cos(a) * R * len, cy + Math.sin(a) * R * len);
  g.lineWidth = R * 0.034; g.lineCap = 'round'; g.strokeStyle = '#ff2a3d'; g.stroke(); g.restore();
  const cap = g.createRadialGradient(cx - R * 0.02, cy - R * 0.02, 1, cx, cy, R * 0.09);
  cap.addColorStop(0, '#f4f4f6'); cap.addColorStop(1, '#55555c');
  g.beginPath(); g.arc(cx, cy, R * 0.085, 0, Math.PI * 2); g.fillStyle = cap; g.fill();
}
function dial(g, cx, cy, R, max, step, minorStep, label, redFrom, fmt, value, a0, sweep) {
  bezel(g, cx, cy, R);
  const ang = v => a0 + sweep * clamp(v / max, 0, 1);
  if (redFrom != null) { g.beginPath(); g.arc(cx, cy, R * 0.9, ang(redFrom), ang(max)); g.lineWidth = R * 0.08; g.strokeStyle = '#c10019'; g.stroke(); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let v = 0; v <= max + 1e-6; v += minorStep) {
    const a = ang(v), major = Math.abs(v / step - Math.round(v / step)) < 1e-6, r1 = R * (major ? 0.78 : 0.85), r2 = R * 0.95;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); g.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);

    if (major) { g.fillStyle = redFrom != null && v >= redFrom ? '#ff4455' : '#f2f2f4'; g.font = '600 ' + Math.round(R * 0.15) + 'px ' + FONT;
      g.fillText(fmt(v), cx + Math.cos(a) * R * 0.62, cy + Math.sin(a) * R * 0.62); }
  }

function draw() {

  const g = g2; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const sim = app.sim, p = PRESETS[app.preset];
  shownRpm += (sim.rpm - shownRpm) * 0.5; shownSpd += (sim.speed - shownSpd) * 0.2;
  const aux = p.turbo ? sim.boost : clamp((sim.oil - 40) / 100, 0, 1); shownAux += (aux - shownAux) * 0.2;
  const maxR = Math.ceil((p.limiter + 600) / 1000) * 1000;

  const sa = dial(g, sx, sy, sR, 320, 40, 20, 'km/h', null, v => String(v), shownSpd, Math.PI * 0.75, Math.PI * 1.5);
  g.fillStyle = '#fff'; g.font = '700 ' + Math.round(sR * 0.26) + 'px ' + FONT; g.fillText(String(Math.round(shownSpd)), sx, sy + sR * 0.45);
  g.font = '700 ' + Math.round(sR * 0.1) + 'px ' + FONT; g.fillStyle = sim.drive ? '#7ee0a5' : '#6d6d78';
  g.fillText(sim.drive ? 'GPS' : sim.driveMode ? 'NO GPS' : 'SIM', sx, sy + sR * 0.68);
  needle(g, sx, sy, sR, sa, 0.9);

  const aa = p.turbo
    ? dial(g, ax, sy, sR, 1, 0.25, 0.125, 'BOOST', null, v => (v * 1.6).toFixed(1).replace('.0', ''), shownAux, Math.PI * 0.75, Math.PI * 1.5)
    : dial(g, ax, sy, sR, 1, 0.25, 0.125, 'OIL °C', 0.85, v => String(Math.round(40 + v * 100)), shownAux, Math.PI * 0.75, Math.PI * 1.5);
  g.fillStyle = '#fff'; g.font = '700 ' + Math.round(sR * 0.22) + 'px ' + FONT;

  needle(g, ax, sy, sR, aa, 0.9);

  g.font = '800 ' + Math.round(R * 0.24) + 'px ' + FONT; g.fillStyle = gear ? '#c9a45c' : '#7d7d88';
  g.fillText(gear ? (sim.drive ? 'D' : '') + gear : 'N', cx, cy + R * 0.67);

    g.beginPath(); g.roundRect ? g.roundRect(cx - tw / 2 + i * (lw + gap), ly, lw, R * 0.07, R * 0.03) : g.rect(cx - tw / 2 + i * (lw + gap), ly, lw, R * 0.07);
    g.fillStyle = on ? col : '#1e1e24'; g.save(); if (on) { g.shadowColor = col; g.shadowBlur = R * 0.1; } g.fill(); g.restore();
  }
  // lower info strip
  g.fillStyle = '#8c8c96'; g.font = '600 ' + Math.round(clamp(R * 0.075, 11, 18)) + 'px ' + FONT; g.textAlign = 'right';
  g.fillText(p.name.replace('Inspired by ', '').toUpperCase() + '  ·  ' + (sim.fuelCut ? 'LIMITER' : sim.shift ? (sim.shift.dir > 0 ? 'UPSHIFT' : 'DOWNSHIFT') : sim.overrun > 0 && sim.thr < 0.2 ? 'OVERRUN' : sim.running ? 'READY' : sim.cranking ? 'CRANKING' : 'OFF'), w - 18, 22); g.textAlign = 'center';
  const st = sim.statusKey, el = $('status');
  el.className = 'status' + (st === 'on' ? ' on' : st === 'crank' ? ' crank' : '');
  $('statusTxt').textContent = { on: 'Engine running', crank: 'Cranking…', stopping: 'Shutting down…', off: 'Engine off' }[st] + (sim.drive ? ' · following GPS speed' : '') + (app.ctx && app.ctx.state !== 'running' ? ' · audio paused' : '');
  const on = sim.running || sim.cranking, sb = $('startBtn');
  if (sb.getAttribute('aria-pressed') !== String(on)) { sb.setAttribute('aria-pressed', String(on)); $('ssMain').textContent = on ? 'STOP' : 'START'; $('ssBot').textContent = on ? 'START' : 'STOP'; }

  if (ge.textContent !== gt) ge.textContent = gt;
  ge.className = 'gps' + (gps.status === 'ok' && $('driveMode').checked ? ' ok' : '');
  document.querySelectorAll('[data-cmd]').forEach(b => b.classList.toggle('active', !!(sim.prog && sim.prog.name === b.dataset.cmd)));

}
